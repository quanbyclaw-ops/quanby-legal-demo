<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" role="img" aria-label="Supreme Court of the Philippines compliance badge">
  <title>Supreme Court of the Philippines – Compliance Certified</title>

  <!-- Shield shape -->
  <path d="M60 4 L112 26 L112 76 C112 107 88 128 60 136 C32 128 8 107 8 76 L8 26 Z"
        fill="#0F172A" stroke="#D97706" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner shield highlight -->
  <path d="M60 14 L102 32 L102 76 C102 102 82 120 60 127 C38 120 18 102 18 76 L18 32 Z"
        fill="#1E3A5F" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>

  <!-- Scales of Justice – beam -->
  <line x1="60" y1="42" x2="60" y2="90" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <!-- Scales – horizontal bar -->
  <line x1="36" y1="50" x2="84" y2="50" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <!-- Scales – left chain -->
  <line x1="36" y1="50" x2="36" y2="64" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Scales – right chain -->
  <line x1="84" y1="50" x2="84" y2="64" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Scales – left pan -->
  <path d="M28 64 Q36 72 44 64" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <!-- Scales – right pan -->
  <path d="M76 64 Q84 72 92 64" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <!-- Scales – base -->
  <rect x="53" y="88" width="14" height="2.5" rx="1.25" fill="#F59E0B"/>
  <rect x="48" y="90" width="24" height="2.5" rx="1.25" fill="#F59E0B"/>

  <!-- Text: SC -->
  <text x="60" y="116" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="3">SC</text>

  <!-- Top star accent -->
  <polygon points="60,8 62,14 68,14 63,18 65,24 60,20 55,24 57,18 52,14 58,14"
           fill="#F59E0B" opacity="0.9"/>
</svg>
