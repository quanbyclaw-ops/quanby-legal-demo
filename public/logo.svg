<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="Quanby Legal Platform logo">
  <title>Quanby Legal Platform</title>
  <!-- Background -->
  <rect width="80" height="80" rx="16" fill="#1E40AF"/>
  <!-- Inner shield accent -->
  <path d="M40 12 L62 22 L62 44 C62 57 52 66 40 70 C28 66 18 57 18 44 L18 22 Z" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Q letterform -->
  <text x="24" y="53" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="white" letter-spacing="-2">Q</text>
  <!-- L letterform -->
  <text x="46" y="53" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#93C5FD" letter-spacing="-1">L</text>
  <!-- Decorative underline -->
  <rect x="20" y="58" width="40" height="2.5" rx="1.25" fill="#3B82F6" opacity="0.7"/>
</svg>
